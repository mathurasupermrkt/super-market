<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mathura QuickMart Delivery Partner dashboard. Track your live GPS location and manage delivery status.">
    <title>Mathura QuickMart – Delivery Partner</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Partner CSS -->
    <link rel="stylesheet" href="../styles/partner.css">
</head>
<body>
    <!-- Top Fixed Header -->
    <header class="partner-header">
        <div class="header-top">
            <h1 class="app-title">Mathura QuickMart Delivery</h1>
            <div class="partner-details">
                <span id="partner-name">Partner Name</span>
                <span class="divider">•</span>
                <span id="partner-email">partner@example.com</span>
            </div>
        </div>

        <div class="header-controls">
            <div class="status-wrapper">
                <label for="status-select">Status:</label>
                <select id="status-select" class="status-dropdown">
                    <option value="offline">Offline</option>
                    <option value="available">Available</option>
                    <option value="on_delivery">On Delivery</option>
                </select>
            </div>

            <div class="button-group">
                <button id="start-btn" class="btn btn-start">Start Tracking</button>
                <button id="stop-btn" class="btn btn-stop" disabled>Stop Tracking</button>
                <button id="logout-btn" class="btn btn-logout">Logout</button>
            </div>
        </div>
    </header>

    <!-- Main Map View -->
    <main class="map-wrapper">
        <div class="delivery-map-section">
            <h3>📍 Live Location</h3>
            <div id="delivery-map"></div>
        </div>
    </main>

    <!-- Bottom Tracking Status Panel -->
    <footer class="bottom-panel">
        <div class="status-indicator">
            <span class="status-dot" id="status-dot"></span>
            <span id="tracking-status">GPS Tracking Stopped</span>
        </div>
    </footer>

    <!-- Incoming Order Modal -->
    <div id="incoming-order-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🔔 New Delivery Request!</h2>
            </div>
            <div class="modal-body">
                <div class="order-info-grid">
                    <p><strong>Order ID:</strong> <span id="incoming-order-id" style="font-size:0.85rem;color:#64748b;"></span></p>
                    <p><strong>Customer:</strong> <span id="incoming-customer-name"></span></p>
                    <p><strong>Total:</strong> <span style="color:#16a34a;font-weight:700;">₹<span id="incoming-total-amount"></span></span></p>
                    <p><strong>Address:</strong> <span id="incoming-address" style="font-size:0.85rem;"></span></p>
                </div>
                <div id="incoming-items-preview" style="background:#f8fafc;border-radius:8px;padding:10px;margin:12px 0;font-size:0.85rem;max-height:100px;overflow-y:auto;"></div>
                <div style="text-align:center;padding:8px;background:#fef2f2;border-radius:8px;">
                    <strong>Time Remaining: </strong>
                    <span id="incoming-timer" style="color:#dc2626;font-weight:bold;font-size:1.2rem;">30</span><span style="color:#dc2626;">s</span>
                </div>
            </div>
            <div class="modal-footer button-group">
                <button id="accept-order-btn" class="btn btn-start">✅ Accept</button>
                <button id="decline-order-btn" class="btn btn-stop">🚫 Decline</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nXC0jkQFDVheydAsHNV1B4b1lsZf63U8AcD6VG0D9=" crossorigin=""></script>
    <!-- Firebase Initialization Module -->
    <script type="module" src="../js/firebase-init.js"></script>
    <!-- Partner JS Module -->
    <script type="module" src="../js/partner.js"></script>
</body>
</html>
