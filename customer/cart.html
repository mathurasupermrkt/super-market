<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View shopping cart items, update quantities, apply coupon codes, and proceed to checkout.">
  <title>Shopping Cart – Mathura Quick Mart</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    .navbar {
      position: sticky;
      top: 0;
      z-index: 500;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--gray-200);
      height: var(--header-height);
      box-shadow: var(--shadow-sm);
    }
    .navbar-inner {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 var(--sp-6);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .navbar-logo { display: flex; align-items: center; gap: var(--sp-2); text-decoration: none; }
    .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: var(--radius-xl); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .logo-text { font-family: var(--font-display); font-weight: var(--fw-black); font-size: var(--text-xl); background: linear-gradient(135deg, var(--primary-dark), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    .cart-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: var(--sp-8);
      margin-top: var(--sp-6);
    }
    .cart-items {
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
    }
    .cart-item {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      padding: var(--sp-4);
      background: var(--white);
      border-radius: var(--radius-xl);
      border: 1px solid var(--gray-200);
    }
    .cart-item-img {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--gray-200);
      flex-shrink: 0;
    }
    .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name { font-size: var(--text-base); font-weight: var(--fw-semi); color: var(--gray-800); margin-bottom: 2px; }
    .cart-item-weight { font-size: var(--text-xs); color: var(--gray-400); margin-bottom: 4px; }
    .cart-item-price { font-size: var(--text-lg); font-weight: var(--fw-bold); color: var(--gray-900); }

    .summary-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: var(--sp-6);
      border: 1px solid var(--gray-200);
      height: fit-content;
      position: sticky;
      top: calc(var(--header-height) + 20px);
    }
    .summary-title { font-size: var(--text-lg); font-weight: var(--fw-bold); margin-bottom: var(--sp-4); }
    .summary-row { display: flex; justify-content: space-between; font-size: var(--text-sm); margin-bottom: var(--sp-3); color: var(--gray-600); }
    .summary-row.total { font-size: var(--text-lg); font-weight: var(--fw-bold); color: var(--gray-900); border-top: 1px solid var(--gray-200); padding-top: var(--sp-4); margin-top: var(--sp-4); }

    .coupon-box { display: flex; gap: var(--sp-2); margin-top: var(--sp-4); }

    /* ---- Responsive ---- */
    @media (max-width: 768px) {
      .cart-grid { grid-template-columns: 1fr; }
    }
  </style>

  <script type='module' src='/js/firebase-init.js'></script>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="../index.html" class="navbar-logo">
      <div class="logo-icon">🛒</div>
      <div>
        <div class="logo-text">Mathura Quick Mart</div>
      </div>
    </a>
    <a href="/customer/products.html" class="btn btn-ghost">← Continue Shopping</a>
  </div>
</nav>

<div class="container section-sm">
  <h1 class="section-title">Shopping Cart</h1>

  <div class="cart-grid">
    <!-- Cart Items list -->
    <div>
      <div class="cart-items" id="cart-items-container">
        <!-- Rendered dynamically -->
      </div>

      <!-- Empty State -->
      <div class="empty-state hidden" id="cart-empty-state">
        <div class="empty-icon">🛒</div>
        <div class="empty-title">Your cart is empty</div>
        <div class="empty-desc">Add items from the store to see them here!</div>
        <a href="/customer/products.html" class="btn btn-primary">Start Shopping</a>
      </div>
    </div>

    <!-- Summary Panel -->
    <aside class="summary-card" id="summary-panel">
      <h2 class="summary-title">Order Summary</h2>

      <div class="summary-row">
        <span>Subtotal</span>
        <span id="summary-subtotal">₹0</span>
      </div>
      <div class="summary-row">
        <span>Delivery Charges</span>
        <span id="summary-delivery">FREE</span>
      </div>
      <div class="summary-row" id="coupon-row" style="display:none;color:var(--success);">
        <span id="applied-coupon-label">Discount (COUPON)</span>
        <span id="summary-discount">-₹0</span>
      </div>
      <div class="summary-row total">
        <span>Total Amount</span>
        <span id="summary-total">₹0</span>
      </div>

      <!-- Coupon Apply -->
      <div class="divider"></div>
      <label class="form-label">Apply Promo Code</label>
      <div class="coupon-box">
        <input type="text" class="form-input" id="coupon-input" placeholder="e.g. FRESH10" style="text-transform:uppercase;">
        <button class="btn btn-outline" onclick="applyCouponCode()">Apply</button>
      </div>
      <div id="coupon-msg" style="font-size:11px;margin-top:4px;"></div>

      <div style="font-size:11px;color:var(--gray-400);margin-top:12px;text-align:center;display:none;">
        🚚 Add <strong>₹<span id="free-delivery-diff">0</span></strong> more for FREE delivery!
      </div>

      <button class="btn btn-primary btn-lg w-full mt-6" onclick="proceedToCheckout()">
        Proceed to Checkout →
      </button>
    </aside>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="../js/app.js"></script>
<script>
  let appliedCoupon = null;
  let couponDiscount = 0;

  function loadCart() {
    const items = MathuraQuickMart.getCart();
    const container = document.getElementById('cart-items-container');
    const emptyState = document.getElementById('cart-empty-state');
    const summaryPanel = document.getElementById('summary-panel');

    if (items.length === 0) {
      container.innerHTML = '';
      emptyState.classList.remove('hidden');
      summaryPanel.style.display = 'none';
      return;
    }

    emptyState.classList.add('hidden');
    summaryPanel.style.display = 'block';

    container.innerHTML = items.map(item => `
      <div class="cart-item">
        <div class="cart-item-img">
          <img src="${item.image}" alt="${item.name}">
        </div>
        <div class="cart-item-info">
          <h3 class="cart-item-name">${item.name}</h3>
          <div class="cart-item-weight">${item.weight}</div>
          <div class="cart-item-price">₹${item.price}</div>
        </div>
        <div class="qty-selector" style="margin-left:auto;">
          <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
          <div class="qty-value">${item.qty}</div>
          <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
        </div>
        <button class="btn btn-ghost btn-icon-sm" onclick="removeItem(${item.id})" style="color:var(--error);" title="Remove Item">✕</button>
      </div>
    `).join('');

    calculateTotals();
  }

  function updateQty(id, change) {
    const cart = MathuraQuickMart.getCart();
    const item = cart.find(i => i.id === id);
    if (item) {
      MathuraQuickMart.updateCartQty(id, item.qty + change);
      loadCart();
    }
  }

  function removeItem(id) {
    MathuraQuickMart.removeFromCart(id);
    loadCart();
  }

  function calculateTotals() {
    const subtotal = MathuraQuickMart.getCartTotal();
    const delivery = 0;

    // Recalculate coupon if applied
    if (appliedCoupon) {
      const res = API.validateCoupon(appliedCoupon.code, subtotal);
      if (res.valid) {
        couponDiscount = res.discount;
        document.getElementById('coupon-row').style.display = 'flex';
        document.getElementById('applied-coupon-label').textContent = `Discount (${appliedCoupon.code})`;
        document.getElementById('summary-discount').textContent = `-₹${Math.round(couponDiscount)}`;
      } else {
        appliedCoupon = null;
        couponDiscount = 0;
        document.getElementById('coupon-row').style.display = 'none';
        document.getElementById('coupon-msg').textContent = res.message;
        document.getElementById('coupon-msg').style.color = 'var(--error)';
      }
    }

    const total = subtotal + delivery - couponDiscount;

    document.getElementById('summary-subtotal').textContent = `₹${subtotal}`;
    document.getElementById('summary-delivery').textContent = delivery === 0 ? 'FREE' : `₹${delivery}`;
    document.getElementById('summary-total').textContent = `₹${Math.round(total)}`;

    // Free delivery diff removed as delivery is always free
    const diffEl = document.getElementById('free-delivery-diff');
    if (diffEl && diffEl.parentElement) {
      diffEl.parentElement.style.display = 'none';
    }
  }

  function applyCouponCode() {
    const code = document.getElementById('coupon-input').value;
    const subtotal = MathuraQuickMart.getCartTotal();
    const msgEl = document.getElementById('coupon-msg');

    if (!code) {
      MathuraQuickMart.toast('Please enter a coupon code', 'warning');
      return;
    }

    const res = API.validateCoupon(code, subtotal);
    if (res.valid) {
      appliedCoupon = res.coupon;
      couponDiscount = res.discount;
      msgEl.textContent = `Applied! ${res.message}`;
      msgEl.style.color = 'var(--success)';
      calculateTotals();
      MathuraQuickMart.toast('🎟️ Coupon applied successfully!', 'success');
    } else {
      appliedCoupon = null;
      couponDiscount = 0;
      msgEl.textContent = res.message;
      msgEl.style.color = 'var(--error)';
      calculateTotals();
    }
  }

  function proceedToCheckout() {
    // Save current coupon state so checkout page can use it
    if (appliedCoupon) {
      localStorage.setItem('mathuraquickmart_active_coupon', JSON.stringify({
        code: appliedCoupon.code,
        discount: couponDiscount
      }));
    } else {
      localStorage.removeItem('mathuraquickmart_active_coupon');
    }

    // Go to checkout
    if (MathuraQuickMart.requireAuth()) {
      window.location.href = '/customer/checkout.html';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadCart();
  });
</script>
</body>
</html>
