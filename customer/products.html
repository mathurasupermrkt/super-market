<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse and search groceries at MathuraQuickMart. Farm-fresh vegetables, dairy, bakery, grains, snacks, and daily essentials.">
  <title>Search Products – Mathura Quick Mart</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    .navbar {
      position: sticky;
      top: 0;
      z-index: 500;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--gray-200);
      height: var(--header-height);
      box-shadow: var(--shadow-sm);
    }
    .navbar-inner {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 var(--sp-6);
      height: 100%;
      display: flex;
      align-items: center;
      gap: var(--sp-6);
    }
    .navbar-logo {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      text-decoration: none;
      flex-shrink: 0;
    }
    .logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: var(--shadow-green);
    }
    .logo-text {
      font-family: var(--font-display);
      font-weight: var(--fw-black);
      font-size: var(--text-xl);
      background: linear-gradient(135deg, var(--primary-dark), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .navbar-search {
      flex: 1;
      max-width: 500px;
      position: relative;
    }
    .search-wrapper { position: relative; }
    .search-input-wrap {
      display: flex;
      align-items: center;
      background: var(--gray-50);
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-full);
      padding: 0.5rem var(--sp-2) 0.5rem var(--sp-4);
      transition: all var(--transition-fast);
    }
    .search-input-wrap:focus-within {
      border-color: var(--primary);
      background: var(--white);
      box-shadow: 0 0 0 4px rgb(34 197 94 / 0.1);
    }
    .search-input-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: var(--text-sm);
      color: var(--gray-800);
      font-family: var(--font-sans);
    }
    .search-btn {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: var(--radius-full);
      color: var(--white);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all var(--transition-fast);
      flex-shrink: 0;
    }
    .search-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--white);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--gray-200);
      z-index: 600;
      overflow: hidden;
      display: none;
    }
    .search-result-item {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-3) var(--sp-4);
      cursor: pointer;
      transition: background var(--transition-fast);
      text-decoration: none;
      color: inherit;
    }
    .search-result-item:hover { background: var(--gray-50); }
    .search-result-icon { font-size: 1.5rem; }
    .search-result-name { font-size: var(--text-sm); font-weight: var(--fw-medium); color: var(--gray-800); }
    .search-result-price { font-size: var(--text-xs); color: var(--primary-dark); font-weight: var(--fw-semi); }

    .navbar-actions {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      flex-shrink: 0;
      margin-left: auto;
    }
    .nav-action-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: var(--sp-2) var(--sp-3);
      border-radius: var(--radius-lg);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all var(--transition-fast);
      color: var(--gray-600);
      font-size: 1.3rem;
      text-decoration: none;
    }
    .nav-action-btn:hover { background: var(--gray-50); color: var(--primary); }
    .nav-action-label { font-size: 9px; font-weight: var(--fw-semi); }
    .nav-cart-btn {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: 0.5rem var(--sp-4);
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: var(--white);
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      font-weight: var(--fw-semi);
      cursor: pointer;
      border: none;
      transition: all var(--transition-fast);
      text-decoration: none;
    }
    .nav-cart-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-green); color: var(--white); }

    /* ---- Products Layout ---- */
    .products-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: var(--sp-8);
      margin-top: var(--sp-6);
    }

    /* ---- Filters Panel ---- */
    .filters-panel {
      position: sticky;
      top: calc(var(--header-height) + 20px);
      height: fit-content;
      max-height: calc(100vh - var(--header-height) - 40px);
      overflow-y: auto;
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: var(--sp-6);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
    }
    .filter-section {
      margin-bottom: var(--sp-6);
    }
    .filter-title {
      font-size: var(--text-sm);
      font-weight: var(--fw-bold);
      color: var(--gray-900);
      margin-bottom: var(--sp-3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .filter-list {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }
    .filter-checkbox {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      font-size: var(--text-sm);
      color: var(--gray-600);
      cursor: pointer;
    }
    .filter-checkbox input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }
    .price-range-inputs {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }
    .price-range-inputs input {
      width: 80px;
    }

    /* ---- Products Content ---- */
    .products-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--sp-6);
    }
    .products-title {
      font-size: var(--text-xl);
      font-weight: var(--fw-bold);
      color: var(--gray-900);
    }
    .products-count {
      font-size: var(--text-sm);
      color: var(--gray-500);
      margin-top: var(--sp-1);
    }
    .products-sort {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--sp-4);
    }

    /* ---- Mobile Bottom Nav ---- */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--white);
      border-top: 1px solid var(--gray-200);
      z-index: 400;
      padding: var(--sp-2) 0 calc(var(--sp-2) + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    }
    .mobile-nav-items { display: flex; justify-content: space-around; }
    .mobile-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: var(--sp-2);
      cursor: pointer;
      color: var(--gray-400);
      font-size: 1.3rem;
      text-decoration: none;
    }
    .mobile-nav-label { font-size: 9px; font-weight: var(--fw-semi); }
    .mobile-nav-item.active { color: var(--primary); }

    /* ---- Responsive ---- */
    @media (max-width: 1024px) {
      .products-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .products-layout { grid-template-columns: 1fr; }
      .filters-panel { display: none; }
      .products-grid { grid-template-columns: repeat(2, 1fr); }
      .navbar-search { display: none; }
      .mobile-bottom-nav { display: block; }
      body { padding-bottom: 70px; }
    }
    @media (max-width: 480px) {
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: var(--sp-3); }
    }
  </style>

  <script type='module' src='/js/firebase-init.js'></script>
</head>
<body>

<!-- Navbar -->
<nav class="navbar" id="main-navbar">
  <div class="navbar-inner">
    <!-- Logo -->
    <a href="../index.html" class="navbar-logo">
      <div class="logo-icon">🛒</div>
      <div>
        <div class="logo-text">Mathura Quick Mart</div>
      </div>
    </a>

    <!-- Search Bar -->
    <div class="navbar-search">
      <div class="search-wrapper">
        <div class="search-input-wrap">
          <span style="color:var(--gray-400);margin-right:8px;">🔍</span>
          <input type="text" placeholder="Search products..." data-search-input id="navbar-search" oninput="runFilter()">
          <button class="search-btn">🔍</button>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="navbar-actions">
      <!-- Wishlist -->
      <a href="/customer/wishlist.html" class="nav-action-btn">
        <span>🤍</span>
        <span class="num-badge" data-wishlist-count style="display:none">0</span>
        <span class="nav-action-label">Wishlist</span>
      </a>

      <!-- User -->
      <div class="dropdown">
        <button class="nav-action-btn" onclick="toggleDropdown('user-menu')">
          <span>👤</span>
          <span class="nav-action-label" data-guest>Login</span>
          <span class="nav-action-label" data-auth style="display:none" data-username></span>
        </button>
        <div class="dropdown-menu" id="user-menu" style="display:none;">
          <div data-auth style="display:none">
            <a class="dropdown-item" href="/customer/dashboard.html">📊 Dashboard</a>
            <a class="dropdown-item" href="/customer/my-orders.html">📦 My Orders</a>
            <a class="dropdown-item" href="/customer/profile.html">👤 Profile</a>
            <a class="dropdown-item" href="/customer/wishlist.html">❤️ Wishlist</a>
            <div class="dropdown-divider"></div>
            <div class="dropdown-item" onclick="MathuraQuickMart.logout()">🚪 Logout</div>
          </div>
          <div data-guest>
            <a class="dropdown-item" href="/customer/login.html">🔑 Login</a>
            <a class="dropdown-item" href="/customer/register.html">📝 Register</a>
          </div>
        </div>
      </div>

      <!-- Staff Portal Icon -->
      <a href="/admin/login.html" class="nav-action-btn" title="Staff Portal (Admin & Delivery)">
        <span>💼</span>
        <span class="nav-action-label">Staff</span>
      </a>

      <!-- Cart -->
      <a href="/customer/cart.html" class="nav-cart-btn" data-cart-icon>
        <span>🛒</span>
        <span class="num-badge" data-cart-count style="display:none">0</span>
      </a>
    </div>
  </div>
</nav>

<div class="container section-sm">
  <!-- Breadcrumb -->
  <div class="breadcrumb mb-6">
    <a href="../index.html">Home</a>
    <span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-current">All Products</span>
  </div>

  <div class="products-layout">
    <!-- Filters Panel -->
    <aside class="filters-panel">
      <div class="filter-section">
        <h3 class="filter-title">Categories</h3>
        <div class="filter-list" id="category-filters">
          <!-- Populated dynamically -->
        </div>
      </div>

      <div class="filter-section">
        <h3 class="filter-title">Price Range</h3>
        <div class="price-range-inputs">
          <input type="number" class="form-input" id="price-min" placeholder="Min" oninput="runFilter()">
          <span style="color:var(--gray-400)">-</span>
          <input type="number" class="form-input" id="price-max" placeholder="Max" oninput="runFilter()">
        </div>
      </div>

      <div class="filter-section">
        <h3 class="filter-title">Offer / Badge</h3>
        <div class="filter-list">
          <label class="filter-checkbox">
            <input type="checkbox" id="badge-organic" onchange="runFilter()">
            Organic
          </label>
          <label class="filter-checkbox">
            <input type="checkbox" id="badge-premium" onchange="runFilter()">
            Premium
          </label>
          <label class="filter-checkbox">
            <input type="checkbox" id="badge-fresh" onchange="runFilter()">
            Fresh
          </label>
        </div>
      </div>
    </aside>

    <!-- Products Content -->
    <main>
      <div class="products-header">
        <div>
          <h1 class="products-title" id="page-title">All Products</h1>
          <div class="products-count" id="products-count">0 items found</div>
        </div>

        <div class="products-sort">
          <span class="form-label" style="margin:0;">Sort by:</span>
          <select class="form-select" id="sort-select" style="width:160px;padding:0.5rem var(--sp-4);" onchange="runFilter()">
            <option value="default">Relevance</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Average Rating</option>
            <option value="discount">Biggest Discount</option>
          </select>
        </div>
      </div>

      <!-- Products Grid -->
      <div class="products-grid" id="products-grid">
        <!-- Rendered dynamically -->
      </div>
    </main>
  </div>
</div>

<!-- Mobile Bottom Navigation -->
<nav class="mobile-bottom-nav">
  <div class="mobile-nav-items">
    <a href="/index.html" class="mobile-nav-item">
      <span>🏠</span>
      <span class="mobile-nav-label">Home</span>
    </a>
    <a href="/customer/products.html" class="mobile-nav-item active">
      <span>🔍</span>
      <span class="mobile-nav-label">Search</span>
    </a>
    <a href="/customer/cart.html" class="mobile-nav-item" style="position:relative;">
      <span>🛒</span>
      <span class="num-badge" data-cart-count style="display:none;">0</span>
      <span class="mobile-nav-label">Cart</span>
    </a>
    <a href="/customer/wishlist.html" class="mobile-nav-item">
      <span>❤️</span>
      <span class="mobile-nav-label">Wishlist</span>
    </a>
    <a href="/customer/dashboard.html" class="mobile-nav-item">
      <span>👤</span>
      <span class="mobile-nav-label">Profile</span>
    </a>
  </div>
</nav>

<div class="toast-container" id="toast-container"></div>

<script src="../js/app.js"></script>
<script>
  let selectedCategory = '';

  function loadFilters() {
    const list = document.getElementById('category-filters');
    if (!list) return;

    list.innerHTML = API.categories.map(cat => `
      <label class="filter-checkbox">
        <input type="radio" name="category-radio" value="${cat.name}" ${cat.name === selectedCategory ? 'checked' : ''} onchange="selectCategory('${cat.name}')">
        ${cat.name}
      </label>
    `).join('') + `
      <label class="filter-checkbox">
        <input type="radio" name="category-radio" value="" ${selectedCategory === '' ? 'checked' : ''} onchange="selectCategory('')">
        Show All
      </label>
    `;
  }

  function selectCategory(catName) {
    selectedCategory = catName;
    document.getElementById('page-title').textContent = catName ? catName : 'All Products';
    runFilter();
  }

  function runFilter() {
    const searchVal = document.getElementById('navbar-search').value;
    const minPrice = parseFloat(document.getElementById('price-min').value) || 0;
    const maxPrice = parseFloat(document.getElementById('price-max').value) || 99999;
    const sortVal = document.getElementById('sort-select').value;

    const organic = document.getElementById('badge-organic').checked;
    const premium = document.getElementById('badge-premium').checked;
    const fresh = document.getElementById('badge-fresh').checked;

    let products = API.getProducts({
      category: selectedCategory || null,
      query: searchVal || null,
      minPrice,
      maxPrice,
      sort: sortVal
    });

    if (organic) products = products.filter(p => p.badge === 'Organic');
    if (premium) products = products.filter(p => p.badge === 'Premium');
    if (fresh) products = products.filter(p => p.badge === 'Fresh' || p.badge === 'Farm Fresh');

    const grid = document.getElementById('products-grid');
    const countEl = document.getElementById('products-count');

    if (grid) {
      if (products.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: span 4;">
            <div class="empty-icon">🔍</div>
            <div class="empty-title">No products found</div>
            <div class="empty-desc">Try checking your spelling or adjusting your filters.</div>
          </div>
        `;
      } else {
        grid.innerHTML = products.map(p => renderProductCard(p)).join('');
      }
    }

    if (countEl) {
      countEl.textContent = `${products.length} item${products.length === 1 ? '' : 's'} found`;
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    // Check url params
    const categoryParam = MathuraQuickMart.getUrlParam('category');
    const queryParam = MathuraQuickMart.getUrlParam('q');
    const filterParam = MathuraQuickMart.getUrlParam('filter');

    if (categoryParam) {
      selectedCategory = categoryParam;
      document.getElementById('page-title').textContent = categoryParam;
    }

    if (queryParam) {
      document.getElementById('navbar-search').value = queryParam;
    }

    loadFilters();

    // Adjust for special filter parameter
    if (filterParam) {
      let title = 'Special Products';
      if (filterParam === 'deals') title = 'Daily Offers';
      if (filterParam === 'featured') title = 'Featured Products';
      if (filterParam === 'bestSeller') title = 'Best Sellers';
      if (filterParam === 'isNew') title = 'New Arrivals';
      document.getElementById('page-title').textContent = title;
    }

    runFilter();

    // Listen for db-ready to reload filters & products
    if (window.dbReady) {
      loadFilters();
      runFilter();
    } else {
      window.addEventListener('db-ready', () => {
        loadFilters();
        runFilter();
      });
    }
  });
</script>

</body>
</html>
