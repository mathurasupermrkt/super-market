<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stay updated with Mathura Quick Mart notifications. Order updates, offers, and alerts all in one place.">
  <title>Notifications – Mathura Quick Mart</title>
  
  <meta name="theme-color" content="#00695c">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/images/icon.svg">
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    .navbar {
      position: sticky; top: 0; z-index: 500;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--gray-200);
      height: var(--header-height);
      box-shadow: var(--shadow-sm);
    }
    .navbar-inner {
      max-width: var(--container-max); margin: 0 auto;
      padding: 0 var(--sp-6); height: 100%;
      display: flex; align-items: center; justify-content: space-between;
    }
    .navbar-logo { display: flex; align-items: center; gap: var(--sp-2); text-decoration: none; }
    .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: var(--radius-xl); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .logo-text { font-family: var(--font-display); font-weight: var(--fw-black); font-size: var(--text-xl); background: linear-gradient(135deg, var(--primary-dark), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    .notif-container { max-width: 700px; }
    .notif-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: var(--sp-6);
    }

    .notif-item {
      display: flex; gap: var(--sp-4); padding: var(--sp-4);
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-xl);
      margin-bottom: var(--sp-3);
      transition: all var(--transition-fast);
      cursor: pointer;
    }
    .notif-item:hover { border-color: var(--primary-light); box-shadow: var(--shadow-sm); }
    .notif-item.unread { background: var(--primary-pale); border-color: var(--primary-light); }
    .notif-item.unread .notif-dot { display: block; }

    .notif-icon {
      width: 44px; height: 44px; border-radius: var(--radius-lg);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
    }
    .notif-icon.order { background: #eff6ff; }
    .notif-icon.promo { background: var(--secondary-pale); }
    .notif-icon.delivery { background: #ecfdf5; }
    .notif-icon.alert { background: #fef2f2; }

    .notif-content { flex: 1; }
    .notif-title { font-size: var(--text-sm); font-weight: var(--fw-semi); color: var(--gray-800); margin-bottom: 4px; }
    .notif-desc { font-size: var(--text-xs); color: var(--gray-500); line-height: 1.5; }
    .notif-time { font-size: 10px; color: var(--gray-400); margin-top: 6px; }
    .notif-dot {
      display: none; width: 8px; height: 8px;
      background: var(--primary); border-radius: 50%;
      flex-shrink: 0; margin-top: 4px;
    }
  </style>

  <script type='module' src='/js/firebase-init.js'></script>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="../index.html" class="navbar-logo">
      <div class="logo-icon">🛒</div>
      <div><div class="logo-text">Mathura Quick Mart</div></div>
    </a>
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="btn btn-ghost btn-sm">📊 Dashboard</a>
      <a href="../index.html" class="btn btn-outline btn-sm">Shop Store</a>
    </div>
  </div>
</nav>

<div class="container section-sm notif-container">
  <div class="breadcrumb mb-6">
    <a href="../index.html">Home</a>
    <span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-current">Notifications</span>
  </div>

  <div class="notif-header">
    <div>
      <h1 style="font-size:var(--text-2xl);font-weight:var(--fw-bold);color:var(--gray-900);">Notifications</h1>
      <p style="font-size:var(--text-sm);color:var(--gray-500);margin-top:4px;">Stay updated with your orders and offers</p>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="markAllRead()">✓ Mark all read</button>
  </div>

  <div id="notifications-list">
    <!-- Rendered dynamically from real user orders & active offers -->
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="../js/app.js"></script>
<script>
  function markAllRead() {
    document.querySelectorAll('.notif-item.unread').forEach(item => {
      item.classList.remove('unread');
    });
    MathuraQuickMart.toast('✓ All notifications marked as read', 'success');
  }

  function renderDynamicNotifications() {
    const listEl = document.getElementById('notifications-list');
    if (!listEl) return;

    const userOrders = MathuraQuickMart.getUserOrders();
    const coupons = API.coupons || [];
    const notifs = [];

    // Build notifications from real user orders
    userOrders.forEach(o => {
      const orderDate = new Date(o.date || o.createdAt || Date.now());
      const timeStr = MathuraQuickMart.formatDate(orderDate.toISOString());

      if (o.status === 'out-delivery' || o.status === 'out-for-delivery') {
        notifs.push({
          icon: '🛵',
          type: 'delivery',
          title: `Order ${o.id} is out for delivery!`,
          desc: o.driverName ? `Your rider ${o.driverName} is on the way with your order.` : 'Your order is on the way to your address.',
          time: timeStr,
          timestamp: orderDate.getTime(),
          unread: true,
          link: `/customer/order-tracking.html?orderId=${encodeURIComponent(o.id)}`
        });
      } else if (o.status === 'delivered') {
        notifs.push({
          icon: '✅',
          type: 'order',
          title: `Order ${o.id} delivered successfully`,
          desc: `Your grocery package has been delivered (Total: ₹${o.total || o.subtotal || 0}). Thank you for shopping with Mathura Quick Mart!`,
          time: timeStr,
          timestamp: orderDate.getTime(),
          unread: false,
          link: `/customer/my-orders.html`
        });
      } else if (o.status === 'confirmed' || o.status === 'pending') {
        notifs.push({
          icon: '📦',
          type: 'order',
          title: `Order ${o.id} placed & confirmed`,
          desc: `We received your order for ${Array.isArray(o.items) ? o.items.length : 1} items. Store staff are currently packing it.`,
          time: timeStr,
          timestamp: orderDate.getTime(),
          unread: false,
          link: `/customer/order-tracking.html?orderId=${encodeURIComponent(o.id)}`
        });
      }
    });

    // Add active coupon announcements
    coupons.slice(0, 2).forEach(c => {
      notifs.push({
        icon: '🏷️',
        type: 'promo',
        title: `Offer: ${c.code} — ${c.description || (c.type === 'percent' ? c.discount + '% OFF' : '₹' + c.discount + ' OFF')}`,
        desc: `Use code ${c.code} at checkout on orders above ₹${c.minOrder || 0}.`,
        time: 'Active Store Offer',
        timestamp: Date.now() - 3600000,
        unread: false,
        link: '/customer/cart.html'
      });
    });

    // Sort newest first
    notifs.sort((a, b) => b.timestamp - a.timestamp);

    if (notifs.length === 0) {
      listEl.innerHTML = `
        <div class="dash-card text-center py-12" style="background:#fff;border-radius:var(--radius-xl);padding:3rem 1.5rem;border:1px solid var(--gray-200);">
          <div style="font-size:2.5rem;margin-bottom:var(--sp-3);">🔔</div>
          <h3 style="font-size:var(--text-lg);font-weight:bold;color:var(--gray-800);margin-bottom:var(--sp-2);">No notifications yet</h3>
          <p style="font-size:var(--text-sm);color:var(--gray-500);margin-bottom:var(--sp-4);">Updates about your active orders, deliveries, and verified store promotions will appear here.</p>
          <a href="/customer/products.html" class="btn btn-primary btn-sm">🛍️ Browse Store</a>
        </div>
      `;
      return;
    }

    listEl.innerHTML = notifs.map(n => `
      <div class="notif-item ${n.unread ? 'unread' : ''}" onclick="${n.link ? `window.location.href='${n.link}'` : 'this.classList.remove(\'unread\')'}" style="cursor:pointer;">
        <div class="notif-icon ${n.type}">${n.icon}</div>
        <div class="notif-content">
          <div class="notif-title">${n.title}</div>
          <div class="notif-desc">${n.desc}</div>
          <div class="notif-time">${n.time}</div>
        </div>
        ${n.unread ? '<div class="notif-dot"></div>' : ''}
      </div>
    `).join('');
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderDynamicNotifications();
    window.addEventListener('user-data-ready', renderDynamicNotifications);
    window.addEventListener('db-ready', renderDynamicNotifications);
  });
</script>
</body>
</html>
