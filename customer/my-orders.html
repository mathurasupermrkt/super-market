<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View and manage your Mathura Quick Mart orders. Track active deliveries, reorder past items, and view order history.">
  <title>My Orders – Mathura Quick Mart</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    .navbar {
      position: sticky;
      top: 0;
      z-index: 500;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--gray-200);
      height: var(--header-height);
      box-shadow: var(--shadow-sm);
    }
    .navbar-inner {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 var(--sp-6);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .navbar-logo { display: flex; align-items: center; gap: var(--sp-2); text-decoration: none; }
    .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: var(--radius-xl); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .logo-text { font-family: var(--font-display); font-weight: var(--fw-black); font-size: var(--text-xl); background: linear-gradient(135deg, var(--primary-dark), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    .orders-container { max-width: 800px; }

    .order-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      border: 1px solid var(--gray-200);
      padding: var(--sp-6);
      margin-bottom: var(--sp-4);
      transition: all var(--transition-base);
    }
    .order-card:hover {
      border-color: var(--primary-light);
      box-shadow: var(--shadow-md);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--sp-4);
    }

    .order-items-list {
      margin: var(--sp-3) 0;
    }
    .order-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      font-size: var(--text-sm);
      border-bottom: 1px solid var(--gray-100);
    }
    .order-item-row:last-child { border-bottom: none; }

    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: var(--sp-4);
      padding-top: var(--sp-4);
      border-top: 1px solid var(--gray-200);
    }

    .filter-tabs {
      display: flex;
      gap: var(--sp-2);
      margin-bottom: var(--sp-6);
      flex-wrap: wrap;
    }
    .filter-tab {
      padding: 0.5rem var(--sp-4);
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      font-weight: var(--fw-semi);
      cursor: pointer;
      border: 1.5px solid var(--gray-200);
      background: var(--white);
      color: var(--gray-600);
      transition: all var(--transition-fast);
    }
    .filter-tab:hover { border-color: var(--primary-light); color: var(--primary); }
    .filter-tab.active {
      background: var(--primary);
      color: var(--white);
      border-color: var(--primary);
    }

    .empty-state {
      text-align: center;
      padding: var(--sp-16) var(--sp-8);
      color: var(--gray-400);
    }
    .empty-state-icon { font-size: 3rem; margin-bottom: var(--sp-4); }

    @media (max-width: 768px) {
      .order-header { flex-direction: column; align-items: flex-start; gap: var(--sp-3); }
      .order-footer { flex-direction: column; gap: var(--sp-3); align-items: flex-start; }
    }
  </style>

  <script type='module' src='/js/firebase-init.js'></script>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="../index.html" class="navbar-logo">
      <div class="logo-icon">🛒</div>
      <div>
        <div class="logo-text">Mathura Quick Mart</div>
      </div>
    </a>
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="btn btn-ghost btn-sm">📊 Dashboard</a>
      <a href="../index.html" class="btn btn-outline btn-sm">Shop Store</a>
    </div>
  </div>
</nav>

<div class="container section-sm orders-container">
  <div class="breadcrumb mb-6">
    <a href="../index.html">Home</a>
    <span class="breadcrumb-sep">/</span>
    <a href="dashboard.html">Dashboard</a>
    <span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-current">My Orders</span>
  </div>

  <h1 class="section-title" style="font-size:var(--text-2xl);margin-bottom:var(--sp-2);">My Orders</h1>
  <p style="color:var(--gray-500);font-size:var(--text-sm);margin-bottom:var(--sp-6);">Track, manage, and reorder your past purchases</p>

  <!-- Filter Tabs -->
  <div class="filter-tabs">
    <button class="filter-tab active" onclick="filterOrders('all', this)">All Orders</button>
    <button class="filter-tab" onclick="filterOrders('processing', this)">Processing</button>
    <button class="filter-tab" onclick="filterOrders('shipped', this)">Shipped</button>
    <button class="filter-tab" onclick="filterOrders('delivered', this)">Delivered</button>
    <button class="filter-tab" onclick="filterOrders('cancelled', this)">Cancelled</button>
  </div>

  <!-- Orders List -->
  <div id="orders-list">
    <!-- Dynamically populated -->
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="../js/app.js"></script>
<script>
  let currentFilter = 'all';

  function filterOrders(status, btnEl) {
    currentFilter = status;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    if (btnEl) btnEl.classList.add('active');
    renderOrders();
  }

  function renderOrders() {
    const allOrders = MathuraQuickMart.state.orders.length > 0 ? MathuraQuickMart.state.orders : API.orders;
    const filtered = currentFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentFilter);
    const container = document.getElementById('orders-list');

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📦</div>
          <h3 style="font-size:var(--text-lg);font-weight:bold;color:var(--gray-600);margin-bottom:var(--sp-2);">No orders found</h3>
          <p style="font-size:var(--text-sm);margin-bottom:var(--sp-6);">${currentFilter === 'all' ? "You haven't placed any orders yet." : `No ${currentFilter} orders.`}</p>
          <a href="../index.html" class="btn btn-primary">Start Shopping</a>
        </div>
      `;
      return;
    }

    container.innerHTML = filtered.map(order => {
      const statusColors = {
        processing: 'badge-orange',
        shipped: 'badge-blue',
        delivered: 'badge-green',
        cancelled: 'badge-red',
        'out-for-delivery': 'badge-blue'
      };
      const statusBadge = statusColors[order.status] || 'badge-orange';

      const itemsHTML = order.items ? order.items.map(item => `
        <div class="order-item-row">
          <span style="color:var(--gray-700);">${item.name} <span style="color:var(--gray-400);">×${item.qty}</span></span>
          <span style="color:var(--gray-900);font-weight:var(--fw-bold);">₹${item.price * item.qty}</span>
        </div>
      `).join('') : `
        <div class="order-item-row">
          <span style="color:var(--gray-500);">Fresh Organic Apple, Dairy Milk, Brown Bread</span>
          <span></span>
        </div>
      `;

      const trackBtn = (order.status !== 'delivered' && order.status !== 'cancelled') 
        ? `<a href="/customer/order-tracking.html" class="btn btn-primary btn-sm">📍 Track Order</a>` 
        : '';

      return `
        <div class="order-card animate-fade-in">
          <div class="order-header">
            <div>
              <strong style="font-size:var(--text-base);color:var(--gray-900);">${order.id}</strong>
              <div style="font-size:12px;color:var(--gray-400);margin-top:4px;">Placed on ${MathuraQuickMart.formatDate(order.date)}</div>
            </div>
            <div class="flex items-center gap-3">
              <span class="badge ${statusBadge}">${order.status.replace('-', ' ')}</span>
              ${trackBtn}
            </div>
          </div>

          <div class="order-items-list">${itemsHTML}</div>

          <div class="order-footer">
            <span style="font-size:var(--text-sm);color:var(--gray-500);">Paid via ${order.paymentMethod || 'UPI'}</span>
            <div class="flex items-center gap-4">
              <strong style="font-size:var(--text-lg);color:var(--primary-dark);">₹${order.total || order.subtotal}</strong>
              <button class="btn btn-outline btn-sm" onclick="reorderItems('${order.id}')">🔄 Reorder</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function reorderItems(orderId) {
    const orders = MathuraQuickMart.state.orders.length > 0 ? MathuraQuickMart.state.orders : API.orders;
    const order = orders.find(o => o.id === orderId);
    if (order && order.items) {
      order.items.forEach(item => MathuraQuickMart.addToCart(item, item.qty));
      MathuraQuickMart.toast('🛒 All items added to cart!', 'success');
      setTimeout(() => { window.location.href = '/customer/cart.html'; }, 1000);
    } else {
      const sample = API.getProduct(1);
      const sample2 = API.getProduct(2);
      MathuraQuickMart.addToCart(sample, 1);
      MathuraQuickMart.addToCart(sample2, 1);
      MathuraQuickMart.toast('🛒 Sample items added to cart!', 'success');
      setTimeout(() => { window.location.href = '/customer/cart.html'; }, 1000);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    MathuraQuickMart.requireAuth();
    renderOrders();
    window.addEventListener('user-data-ready', renderOrders);
  });
</script>
</body>
</html>
