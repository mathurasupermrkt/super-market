<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist – Mathura Quick Mart</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    .navbar {
      position: sticky;
      top: 0;
      z-index: 500;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--gray-200);
      height: var(--header-height);
      box-shadow: var(--shadow-sm);
    }
    .navbar-inner {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 var(--sp-6);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .navbar-logo { display: flex; align-items: center; gap: var(--sp-2); text-decoration: none; }
    .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: var(--radius-xl); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .logo-text { font-family: var(--font-display); font-weight: var(--fw-black); font-size: var(--text-xl); background: linear-gradient(135deg, var(--primary-dark), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  </style>

  <script type='module' src='/js/firebase-init.js'></script>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="../index.html" class="navbar-logo">
      <div class="logo-icon">🛒</div>
      <div>
        <div class="logo-text">Mathura Quick Mart</div>
      </div>
    </a>
    <a href="/customer/products.html" class="btn btn-ghost">🏪 Shop Products</a>
  </div>
</nav>

<div class="container section-sm">
  <h1 class="section-title mb-8">My Wishlist</h1>

  <div class="products-grid" id="wishlist-grid">
    <!-- Rendered dynamically -->
  </div>

  <!-- Empty State -->
  <div class="empty-state hidden" id="wishlist-empty">
    <div class="empty-icon">❤️</div>
    <div class="empty-title">Your wishlist is empty</div>
    <div class="empty-desc">Tap the heart icon on any product card to save it for later!</div>
    <a href="/customer/products.html" class="btn btn-primary">Browse Products</a>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="../js/app.js"></script>
<script>
  function loadWishlist() {
    const list = MathuraQuickMart.getWishlist();
    const grid = document.getElementById('wishlist-grid');
    const emptyState = document.getElementById('wishlist-empty');

    if (list.length === 0) {
      grid.innerHTML = '';
      emptyState.classList.remove('hidden');
      return;
    }

    emptyState.classList.add('hidden');
    grid.innerHTML = list.map(product => renderProductCard(product)).join('');
  }

  // Override standard toggleWishlist to reload current page list
  const originToggle = toggleWishlist;
  toggleWishlist = function(productId) {
    originToggle(productId);
    loadWishlist();
  };

  document.addEventListener('DOMContentLoaded', () => {
    loadWishlist();
  });
</script>
</body>
</html>
