<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – Mathura Quick Mart</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    body {
      background: radial-gradient(circle at 10% 20%, #f0fdf4 0%, #f8fafc 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-4);
    }
    .forgot-container {
      width: 100%;
      max-width: 420px;
    }
  </style>

  <script type='module' src='/js/firebase-init.js'></script>
</head>
<body>

<div class="forgot-container animate-scale-in">
  <div style="text-align:center;margin-bottom:var(--sp-6);">
    <a href="../index.html" class="navbar-logo" style="display:inline-flex;align-items:center;gap:var(--sp-2);">
      <div class="logo-icon">🛒</div>
      <div>
        <div class="logo-text" style="font-size:var(--text-2xl);">Mathura Quick Mart</div>
      </div>
    </a>
  </div>

  <div class="card p-8">
    <h1 style="font-size:var(--text-xl);font-weight:var(--fw-bold);margin-bottom:var(--sp-4);text-align:center;">Reset Password</h1>
    <p style="font-size:var(--text-sm);color:var(--gray-500);text-align:center;margin-bottom:var(--sp-6);">Enter your email address and we'll send you an OTP to reset your password.</p>

    <!-- Email Step -->
    <div id="step-email">
      <div class="form-group mb-6">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" id="forgot-email" placeholder="name@domain.com" required>
      </div>

      <button class="btn btn-primary btn-lg w-full" onclick="sendOtp()">
        Send Verification Code
      </button>
    </div>

    <!-- OTP Step -->
    <div id="step-otp" class="hidden">
      <div class="form-group mb-4">
        <label class="form-label">Enter 6-Digit OTP</label>
        <input type="text" class="form-input text-center" id="otp-input" placeholder="000 000" maxlength="6" style="letter-spacing:6px;font-size:1.5rem;font-weight:bold;">
      </div>

      <div class="form-group mb-6">
        <label class="form-label">New Password</label>
        <input type="password" class="form-input" id="new-password" placeholder="At least 6 characters">
      </div>

      <button class="btn btn-primary btn-lg w-full" onclick="resetPassword()">
        Reset Password
      </button>
    </div>

    <div class="divider"></div>

    <p style="font-size:var(--text-sm);color:var(--gray-500);text-align:center;">
      Remember password? <a href="login.html">Sign In</a>
    </p>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="../js/app.js"></script>
<script>
  function sendOtp() {
    const email = document.getElementById('forgot-email').value;
    if (!email || !email.includes('@')) {
      MathuraQuickMart.toast('Please enter a valid email address', 'error');
      return;
    }

    MathuraQuickMart.toast('📧 OTP sent successfully to ' + email, 'success');
    document.getElementById('step-email').classList.add('hidden');
    document.getElementById('step-otp').classList.remove('hidden');
  }

  function resetPassword() {
    const otp = document.getElementById('otp-input').value;
    const newPass = document.getElementById('new-password').value;

    if (otp.length !== 6) {
      MathuraQuickMart.toast('Please enter the 6-digit OTP code', 'error');
      return;
    }

    if (newPass.length < 6) {
      MathuraQuickMart.toast('New password must be at least 6 characters', 'error');
      return;
    }

    MathuraQuickMart.toast('🔒 Password updated successfully! Redirecting...', 'success');
    setTimeout(() => {
      window.location.href = '/customer/login.html';
    }, 1500);
  }
</script>
</body>
</html>
